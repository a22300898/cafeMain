<!DOCTYPE html>
<html lang="es">
<link rel="stylesheet" href="style.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extremely Cool Beverages</title>

</head>
<script src="script.js"></script>
<body>
<div class="container">
    <h1>Extremely Cool Beverages</h1>

    <form action="/crear" method="POST">
        <div class="form-group field-nombre">
            <input type="text" id="nombre" name="nombre" placeholder="nombre" required>
        </div>

        <div class="form-group field-correo">
            <input type="email" id="correo" name="correo" placeholder="correo" required>
        </div>

        <div class="form-row-top">
            <div class="form-group field-tipo-bebida">
                <div class="tipo-container">
                    <label for="tipo_bebida" class="section-title">tipo de bebida</label>
                    <select id="tipo_bebida" name="producto">
                        <option value="espresso">Espresso</option>
                        <option value="americano">Americano</option>
                        <option value="capuchino">Capuchino</option>
                        <option value="latte">Latte</option>
                    </select>
                </div>

                <div class="size-container">
                    <label class="section-title">tamaño</label>
                    <div class="size-options">
                        <label><input type="radio" name="size_bebida" value="pequeno" checked> Pequeño</label>
                        <label><input type="radio" name="size_bebida" value="mediano"> Mediano</label>
                        <label><input type="radio" name="size_bebida" value="grande"> Grande</label>
                    </div>
                </div>
            </div>

            <div class="form-group field-cantidad">
                <label for="cantidad" class="section-title">cantidad</label>
                <input type="number" id="cantidad" name="cantidad" value="1" min="1">
            </div>
        </div>

        <div class="form-row-middle">
            <div class="form-group field-imagen">
                <div class="imagen-box">
                    <img src="https://i.pinimg.com/736x/9d/7e/77/9d7e77d6568e981cbe015bbbfd6239e1.jpg" alt="Imagen chistosa">
                </div>
            </div>

            <div class="form-group field-llevar">
                <label class="checkbox-container">
                    <input type="checkbox" id="llevar" name="llevar">
                    <span class="checkmark">✓</span>
                    <span class="llevar-text">para llevar?</span>
                </label>
            </div>
        </div>

        <div class="form-group field-observaciones">
            <textarea id="observaciones" name="observaciones" placeholder="observaciones" rows="4"></textarea>
        </div>

        <div class="form-row-buttons">
            <button type="reset" class="btn btn-limpiar">limpiar</button>
            <button type="submit" class="btn btn-confirmar">confirmar pedido</button>
        </div>
    </form>
</div>
</body>
</html>
